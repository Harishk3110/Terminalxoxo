services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knk_terminal
      POSTGRES_USER: knk
      POSTGRES_PASSWORD: knk_local_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knk -d knk_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knk-local
      MINIO_ROOT_PASSWORD: knk-local-demo
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  public-web:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP_FILTER: "@knk/public-web"
    command: pnpm --filter @knk/public-web dev --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  terminal-web:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP_FILTER: "@knk/terminal-web"
    command: pnpm --filter @knk/terminal-web dev --hostname 0.0.0.0 --port 3001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

  worker-data:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: worker-data
    command: python -m app.main --daemon
    env_file: .env.example
    depends_on:
      - api

  worker-quant:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: worker-quant
    command: python -m app.main --daemon
    env_file: .env.example
    depends_on:
      - api

  report-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: report-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    env_file: .env.example
    ports:
      - "8010:8010"

  broker-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: broker-agent
    command: uvicorn agent.main:app --host 0.0.0.0 --port 8020
    env_file: .env.example
    ports:
      - "8020:8020"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  minio-data:
  grafana-data:
