services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knk_terminal
      POSTGRES_USER: knk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knk -d knk_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/knk-terminal-local
        mc anonymous set none local/knk-terminal-local
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: api
    command: /bin/sh -c "alembic upgrade head && python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: ${KNK_COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for PostgreSQL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: knk-terminal-local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  terminal-web:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP_FILTER: "@knk/terminal-web"
    command: pnpm --filter @knk/terminal-web start --hostname 0.0.0.0 --port 3001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      KNK_API_URL: http://api:8000
      NEXT_PUBLIC_APP_ENV: local
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  worker-data:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: api
    command: python -m app.queue_worker --kind data --daemon
    env_file: ${KNK_COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for PostgreSQL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: knk-terminal-local
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.queue_worker", "--kind", "data", "--healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  worker-quant:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: api
    command: python -m app.queue_worker --kind quant --daemon
    env_file: ${KNK_COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for PostgreSQL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: knk-terminal-local
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.queue_worker", "--kind", "quant", "--healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  report-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      args:
        SERVICE_DIR: api
    command: uvicorn app.report_engine:app --host 0.0.0.0 --port 8010
    env_file: ${KNK_COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for PostgreSQL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: knk-terminal-local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/knk-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
