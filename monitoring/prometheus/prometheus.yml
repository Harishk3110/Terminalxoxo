global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "knk-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: "knk-report-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["report-engine:8010"]
  - job_name: "knk-broker-agent"
    metrics_path: /metrics
    static_configs:
      - targets: ["broker-agent:8020"]
