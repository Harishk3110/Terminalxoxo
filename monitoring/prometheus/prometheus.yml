global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/backup-alerts.yml

scrape_configs:
  - job_name: "knk-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: "knk-reports"
    metrics_path: /metrics
    static_configs:
      - targets: ["report-engine:8010"]
