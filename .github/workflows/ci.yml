name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test-unit
      - run: pnpm security-check
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: test
          KNK_API_URL: http://127.0.0.1:8000

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt -r services/local-agent/requirements.txt
      - run: python -m pytest services/api/tests
      - run: python -m py_compile services/worker-data/app/main.py services/worker-quant/app/main.py services/report-engine/app/main.py services/broker-agent/agent/main.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/node.Dockerfile -t knk-terminal-web .
      - run: docker build -f infrastructure/docker/python.Dockerfile --build-arg SERVICE_DIR=api -t knk-api .
